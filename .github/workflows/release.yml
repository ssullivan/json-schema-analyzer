name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean verify --batch-mode
      - name: Locate CLI jar
        id: jar
        run: |
          jar=$(ls cli/target/json-schema-explorer-*.jar | grep -v -e sources -e javadoc -e original)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.jar.outputs.path }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
