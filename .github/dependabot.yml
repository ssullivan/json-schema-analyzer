version: 2

updates:
  # Jackson, picocli, and JUnit had each drifted a year or more behind before being updated
  # by hand; these keep that from silently recurring.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine updates arrive as one reviewable batch — Jackson alone spans three artifacts.
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
      # Majors stay isolated: they need independent review and revert, and bundling one in
      # would block every safe update behind it if it breaks the build.
      maven-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
      github-actions-major:
        update-types:
          - major
